[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-dashboard"
version = "0.1.0"
description = "Payment success rate optimization dashboard"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
    "python-dotenv>=1.0,<2",
    "streamlit>=1.40,<2",
    "supabase>=2.15,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
payment-prepare = "payment_dashboard.prepare_data:main"
payment-load-supabase = "payment_dashboard.load_supabase:main"

[tool.setuptools.packages.find]
include = ["payment_dashboard*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that do I/O (filesystem, subprocess, Streamlit)",
]
