name: quality

on:
  push:
  pull_request:

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make setup
      - run: make lint
      - run: .venv/bin/ruff format --check payment_dashboard tests scripts
      - run: make typecheck
      - run: make test
      - run: .venv/bin/python -m build
      - run: make verify-clean
